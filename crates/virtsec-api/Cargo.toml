[package]
name = "virtsec-api"
description = "virtsec tool contract v1: ops, events, the SecEvent wire schema, guest inventories. Imported by the mlab backend."
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/mlab-sh/virtsec"
rust-version = "1.85"

# Standalone on purpose: mlab.sh imports this crate alone, without pulling
# the rest of virtsec (aya, reqwest, ...).
[dependencies]
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
