[package]
name = "virtsec"
description = "Runtime security CLI for Proxmox VE nodes: LXC and VM inventory, loaded/dormant vulnerabilities"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/mlab-sh/virtsec"
rust-version = "1.85"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
futures = "0.3"
libc = "0.2"
owo-colors = "4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# rpmdb.sqlite reader; bundles SQLite (C build), hence opt-in.
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = { version = "0.4", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
# Inventory RPM-based guests (Rocky, Alma, RHEL) via rpmdb.sqlite.
rpm = ["dep:rusqlite"]

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
