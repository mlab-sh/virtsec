[package]
name = "virtsec"
description = "Runtime security CLI for Proxmox VE nodes: LXC and VM inventory, loaded/dormant vulnerabilities"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/mlab-sh/virtsec"
rust-version = "1.85"

# Debian package for apt.mlab.sh (PVE nodes are Debian). `cargo deb`;
# `target/release/` is mapped to `target/<triple>/release/` with --target.
[package.metadata.deb]
maintainer = "mlab <hello@mlab.sh>"
copyright = "mlab"
license-file = ["LICENSE", "0"]
section = "admin"
priority = "optional"
extended-description = """\
virtsec tells what runs in every LXC container and VM of a Proxmox VE node, \
which vulnerabilities touch code that is actually loaded in memory, and streams \
what happens on the node (execs, connects, writes, logins, config changes). \
Standalone CLI, or a tool of mlab-agent for an mlab.sh workspace."""
depends = "$auto"
recommends = "mlab-agent"
assets = [
    ["target/release/virtsec", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/virtsec/README.md", "644"],
]

# RPM for pkg.mlab.sh/rpm. auto-req off (ldd on a cross build); glibc >= 2.35
# is the floor of the ubuntu-22.04 build host.
[package.metadata.generate-rpm]
summary = "Runtime security for Proxmox VE nodes: guest inventory, loaded vulnerabilities, live events"
license = "Apache-2.0"
url = "https://github.com/mlab-sh/virtsec"
assets = [
    { source = "target/release/virtsec", dest = "/usr/bin/virtsec", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/virtsec/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/virtsec/LICENSE", mode = "644" },
]
auto-req = "no"

[package.metadata.generate-rpm.requires]
glibc = ">= 2.35"

[workspace]
members = [".", "crates/virtsec-api", "crates/virtsec-probe-common", "crates/virtsec-probe-ebpf"]
# The BPF crate only ever builds for the BPF target, from build.rs (feature
# `ebpf`): a plain `cargo build` / `test` never compiles it.
default-members = [".", "crates/virtsec-api"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
ciborium = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
futures = "0.3"
libc = "0.2"
owo-colors = "4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# rpmdb.sqlite reader; bundles SQLite (C build), hence opt-in.
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
tar = { version = "0.4", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
virtsec-api = { path = "crates/virtsec-api" }

# eBPF loader, only with the `ebpf` feature (Linux).
aya = { version = "0.13", optional = true }
virtsec-probe-common = { path = "crates/virtsec-probe-common", optional = true }

# aya-build compiles the kernel crate from build.rs; Linux only.
[target.'cfg(target_os = "linux")'.build-dependencies]
aya-build = "0.1"

[features]
# Inventory RPM-based guests (Rocky, Alma, RHEL) via rpmdb.sqlite.
rpm = ["dep:rusqlite"]
# Kernel probe for `watch`: exec, TCP connect, sensitive file writes (Linux,
# nightly + bpf-linker at build time). Without it, exec comes from the proc connector.
ebpf = ["dep:aya", "dep:virtsec-probe-common"]

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
