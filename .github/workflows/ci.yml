name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: fmt · clippy · build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      # Default members only (excludes virtsec-probe-ebpf, which builds for the
      # BPF target). The `ebpf` feature needs a nightly BPF toolchain +
      # bpf-linker that CI doesn't provide: the release workflow builds it.
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test --workspace

      # rpmdb.sqlite support bundles SQLite (C build), hence its own feature.
      - name: rpm feature (clippy + test)
        run: |
          cargo clippy --all-targets --features rpm -- -D warnings
          cargo test --features rpm
