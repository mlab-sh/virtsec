name: Release

# By hand, like k3sec's: bump `[package] version` in Cargo.toml, then run this
# workflow. It tags `v<version>` itself.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the packages to apt.mlab.sh / pkg.mlab.sh (off = build and keep the artifacts only)
        type: boolean
        default: true
      sync_wait:
        description: Seconds to wait between the .deb and .rpm uploads (the repository sync runs on each)
        type: number
        default: 180

permissions:
  contents: write
  id-token: write   # cosign keyless signature (GitHub OIDC)

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace --locked

  version:
    name: Resolve version
    needs: test
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Version from [package]
        id: v
        run: |
          V=$(awk -F '"' '/^\[package\]/{p=1} p && /^version[[:space:]]*=/{print $2; exit}' Cargo.toml)
          test -n "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 on purpose (as k3sec): the glibc floor is the build host's.
          # 2.35 runs on PVE 8 (Debian 12, 2.36) and PVE 9 (Debian 13, 2.41),
          # not on PVE 7 (Debian 11, 2.31). x86_64 only: PVE ships amd64.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, deb: amd64 }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The eBPF probe: build.rs compiles crates/virtsec-probe-ebpf for the
      # BPF target with aya-build, which needs nightly + rust-src and
      # bpf-linker. aya-build passes the userland target's arch to the BPF
      # program (kprobe registers differ).
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The prebuilt static binary: `cargo install bpf-linker` needs a system
      # LLVM of the exact major it was released for.
      - name: bpf-linker
        run: |
          curl -fsSL https://github.com/aya-rs/bpf-linker/releases/download/v0.12.0/bpf-linker-x86_64-unknown-linux-musl.tar.zst \
            | tar --zstd -x -C ~/.cargo/bin
          bpf-linker --version

      - name: Build (eBPF probe + rpm support)
        run: cargo +stable build --release --locked -p virtsec --features ebpf,rpm --target ${{ matrix.target }}

      # The probe must be in the binary. aya-build leaves the object it
      # embedded in the build-script OUT_DIR: it must be a BPF ELF, and its
      # bytes must be inside the virtsec binary.
      - name: Check the embedded BPF object
        run: |
          OBJ=$(ls target/${{ matrix.target }}/release/build/virtsec-*/out/virtsec-bpf | head -1)
          file "$OBJ" | tee /dev/stderr | grep -q 'eBPF'
          python3 - "$OBJ" "target/${{ matrix.target }}/release/virtsec" <<'PY'
          import sys
          obj, binary = (open(p, 'rb').read() for p in sys.argv[1:3])
          assert obj in binary, "BPF object not embedded in the binary"
          for prog in (b"virtsec_execve", b"virtsec_openat", b"virtsec_tcp_v4_connect", b"virtsec_tcp_v6_connect"):
              assert prog in obj, prog
          print(f"embedded BPF object: {len(obj)} bytes")
          PY
          sha256sum "$OBJ" | tee "bpf-${{ matrix.deb }}.sha256"

      - name: Package archive
        id: pkg
        run: |
          NAME="virtsec-${VERSION}-${{ matrix.target }}"
          STAGE="$(mktemp -d)/${NAME}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/virtsec" LICENSE README.md "$STAGE/"
          tar -czf "${NAME}.tar.gz" -C "$(dirname "$STAGE")" "$NAME"
          echo "file=${NAME}.tar.gz" >> "$GITHUB_OUTPUT"

      # --no-strip: the release profile strips already.
      - name: Build .deb and .rpm
        id: pkgs
        run: |
          cargo +stable install cargo-deb cargo-generate-rpm --locked
          DEB="virtsec_${VERSION}_${{ matrix.deb }}.deb"
          cargo deb -p virtsec --no-build --no-strip --target ${{ matrix.target }} --deb-version "$VERSION" -o "$DEB"
          mkdir -p rpm-out
          cargo generate-rpm -p . --target ${{ matrix.target }} -s "version = \"$VERSION\"" -o rpm-out/
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"
          echo "rpm=$(ls rpm-out/*.rpm)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: virtsec-${{ matrix.deb }}
          path: |
            ${{ steps.pkg.outputs.file }}
            bpf-${{ matrix.deb }}.sha256
            ${{ steps.pkgs.outputs.deb }}
            ${{ steps.pkgs.outputs.rpm }}

  release:
    name: Publish
    needs: [version, build]
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -la dist
          cat dist/bpf-*.sha256

      # Checksums signed keyless (Sigstore, this workflow's GitHub identity):
      # no key to keep.
      - name: Checksums
        run: |
          cd dist
          sha256sum virtsec-*.tar.gz virtsec_*.deb virtsec-*.rpm > SHA256SUMS
          cat SHA256SUMS
      - uses: sigstore/cosign-installer@v3
      - name: Sign the checksums
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          generate_release_notes: true
          files: |
            dist/virtsec-*.tar.gz
            dist/virtsec_*.deb
            dist/virtsec-*.rpm
            dist/SHA256SUMS
            dist/SHA256SUMS.sigstore.json

      # ---- apt + rpm repositories (apt.mlab.sh / pkg.mlab.sh) -------------
      # Same bucket and layout as every mlab tool: mlab-sh/apt's sync workflow
      # signs and indexes. Pool objects are immutable: never re-publish a
      # version.
      - name: Upload packages to the repositories
        if: inputs.publish
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: apt-mlab-sh
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then echo "::warning::R2 secrets not set: packages not published"; exit 0; fi
          if aws s3api head-object --bucket "$BUCKET" --key "pool/main/v/virtsec/virtsec_${VERSION}_amd64.deb" --endpoint-url "$ENDPOINT" >/dev/null 2>&1; then
            echo "::error::virtsec ${VERSION} is already in the pool: bump the version"; exit 1
          fi
          aws s3 cp dist/ "s3://$BUCKET/pool/main/v/virtsec/" --recursive --exclude '*' --include '*.deb' \
            --endpoint-url "$ENDPOINT" --cache-control "public, max-age=31536000, immutable"
          sleep ${{ inputs.sync_wait }}
          aws s3 cp dist/ "s3://$BUCKET/rpm/incoming/" --recursive --exclude '*' --include '*.rpm' --endpoint-url "$ENDPOINT"
